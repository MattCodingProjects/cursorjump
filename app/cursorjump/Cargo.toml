[package]
name = "cursorjump"
version.workspace = true
edition.workspace = true

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1"
cj-core = { path = "../../crates/cj-core" }
cj-net = { path = "../../crates/cj-net" }
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17.2"
tao = "0.37.1"
tiny-skia = "0.12.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tray-icon = "0.26.1"
unicode-normalization = "0.1"
# Dragged web links (common/link_fetch.rs): rustls on ring (shared with
# cj-net), checking certificates with the OS trust store
# (rustls-platform-verifier, R41). `_ring` is ureq's own switch for the ring
# provider; the public `rustls` feature would also pull in webpki-roots.
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
url = "2.5.8"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Console", "Win32_Security", "Win32_System_Ole", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices", "Win32_Storage_FileSystem"] }
# `#[implement]` (COM objects for drag-and-drop) expands to `::windows_core` paths.
windows-core = "0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-graphics", "objc2-uniform-type-identifiers", "NSAppearance", "NSApplication", "NSCell", "NSColor", "NSControl", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSFilePromiseReceiver", "NSGraphics", "NSImage", "NSImageView", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSTrackingArea", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGDirectDisplay", "CGDisplayConfiguration", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage", "CGRemoteOperation", "CGError", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSObjCRuntime", "NSOperation", "NSProcessInfo", "NSString", "NSThread", "NSURL", "NSValue"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "pwr_mgt"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"] }
# SIGTERM (launchctl bootout, logout) runs the normal quit.
tokio = { version = "1.53.3", features = ["signal"] }

[dev-dependencies]
tempfile = "3"

# Tests draw the pills' CGImages back into a bitmap (mac/pill.rs).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGBitmapContext", "CGContext"] }

[build-dependencies]
embed-manifest = "1.5.1"
