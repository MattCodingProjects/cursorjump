name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test -p cj-core -p cj-net --locked
      # The root AWDL helper's tests are hermetic (fake interface, temp sockets).
      - if: matrix.os == 'macos-latest'
        run: cargo test -p cursorjump-netd --locked
      # App tests: Windows runs them all (tests that touch the live clipboard
      # are #[ignore]d); on macOS they need Accessibility and the user's
      # pasteboard, so CI only compiles them there.
      - if: matrix.os == 'windows-latest'
        run: cargo test -p cursorjump --locked
      - if: matrix.os == 'macos-latest'
        run: cargo test -p cursorjump --no-run --locked
      # Hermetic: checks the audio pipe never touches the heap on the
      # real-time thread (macOS std mutexes allocate on first use).
      - if: matrix.os == 'macos-latest'
        run: cargo test -p cursorjump --test audio_pipe_no_alloc --locked
      # The Core Audio driver (C): build it unsigned, and test its ring.
      - if: matrix.os == 'macos-latest'
        run: ./scripts/mac/build-audio-driver.sh --no-sign
      - if: matrix.os == 'macos-latest'
        run: >-
          mkdir -p target &&
          clang -std=c11 -O2 app/cursorjump-audio-driver/src/ring.c
          app/cursorjump-audio-driver/tests/ring_test.c -o target/ring_test &&
          target/ring_test
