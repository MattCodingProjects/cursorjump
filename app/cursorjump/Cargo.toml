[package]
name = "cursorjump"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
cj-core = { path = "../../crates/cj-core" }
cj-net = { path = "../../crates/cj-net" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17.2"
tao = "0.37.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tray-icon = "0.26.1"

[target."cfg(windows)".dependencies]
crossbeam-channel = "0.5.17"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Console", "Win32_Security"] }

[build-dependencies]
embed-manifest = "1.5.1"
