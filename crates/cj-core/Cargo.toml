[package]
name = "cj-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
anyhow = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
